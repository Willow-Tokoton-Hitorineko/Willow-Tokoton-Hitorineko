# 猫在追鱼干：生成 SVG 并提交到 master/output/（避免 output 分支部署失败）
# https://github.com/Platane/snk

name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/snake.yml"

# 仓库 Settings → Actions → General → Workflow permissions 须为 Read and write
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=F97316&color_dots=#ebedf0,#ffedd5,#fdba74,#f97316,#ea580c
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=F97316&color_dots=#161b22,#3f2d2a,#c2410c,#f97316,#fb7185

      - name: Commit snake SVG to master/output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p output
          cp dist/*.svg output/
          git add output/*.svg
          if git diff --staged --quiet; then
            echo "No snake changes to commit"
            exit 0
          fi
          git commit -m "chore: update contribution snake [skip ci]"
          git push
